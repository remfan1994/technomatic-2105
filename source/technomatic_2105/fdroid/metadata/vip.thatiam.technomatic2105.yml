AutoName: Technomatic 2105
Summary: Procedural electronic music generator for Android
Description: |-
    Technomatic 2105 generates synthetic electronic music directly on Android without samples or network access.

    The default is No Channel and one indefinitely evolving sound. No Channel leaves the generator unrestricted. The current seed remains fixed until the listener explicitly changes it; there is no automatic replacement or live duration boundary.

    Optional Channels contribute predictable character while retaining 50 percent unrestricted generation: Chrome Pulse, Velvet Circuit, Glass Trap, Dust Machine, Liquid Grid, Neon Drift, Broken Speaker, Deep Magnet, Pixel Ritual, Soft Voltage, Heavy Orbit, and Cold Arcade. Hybrid Channels keep the first selected channel dominant and add weaker secondary influences.

    All pitched layers are generated from musical grammar rather than stored finished note sequences. Each sound receives generated harmony, lead, hook, verse, bass statement/answer, counter-line, arpeggio, pulse, ornament, recall, and bounded long-form evolution. A per-sound timbre grammar selects among broad bass, lead, pad, drum, articulation, and chord-voicing families while preserving each sound's identity.

    Offline export supports compact OGG and lossless FLAC files under the public Music collection.

    Privacy and freedom properties:

    * no Internet permission
    * no accounts
    * no advertising SDKs
    * no analytics
    * no trackers
    * no external sound assets
    * no sample packs

